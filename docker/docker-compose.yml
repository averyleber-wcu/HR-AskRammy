# ── Rammy HR Chatbot — Docker Compose (with MCP Server) ──────────────────────
# First-time setup:
#   1. docker-compose up --build -d       ← build and start all services
#   2. docker exec rammy-python python qdrant_setup.py  ← populate the vector DB
#      (or call: curl -X POST http://localhost:5001/refresh)

services:

  # ── SeaweedFS Object Storage ───────────────────────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333" # s3 gateway
      - "8888:8888" # web ui
      - "9333:9333" # master server/dashboard
    command: >
      server
      -dir=/data
      -ip=seaweedfs
      -filer
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -ip.bind=0.0.0.0
    volumes:
      - seaweedfs_storage:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Database ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rammy-qdrant
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Rammy MCP Server (FastMCP) ─────────────────────────────────────────────
  rammy-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: rammy-mcp
    command: python rammy_mcp_server.py
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SEAWEEDFS_HOST=seaweedfs:8333
      - SEAWEEDFS_USER=${SEAWEEDFS_USER:-seaweedfsadmin}
      - SEAWEEDFS_PASS=${SEAWEEDFS_PASS:-seaweedfsadmin}
      - SEAWEEDFS_BUCKET=${SEAWEEDFS_BUCKET:-documents}
      - PDF_PROXY_BASE=${PDF_PROXY_BASE:-http://localhost:3000/api/pdf}
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 8000), 2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Python Flask Backend (MCP Client + Guardrails) ─────────────────────────
  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: rammy-python
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - MCP_SERVER_URL=http://rammy-mcp:8000/mcp
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SEAWEEDFS_HOST=seaweedfs:8333
      - SEAWEEDFS_USER=${SEAWEEDFS_USER:-seaweedfsadmin}
      - SEAWEEDFS_PASS=${SEAWEEDFS_PASS:-seaweedfsadmin}
      - SEAWEEDFS_BUCKET=${SEAWEEDFS_BUCKET:-documents}
      - PDF_PROXY_BASE=${PDF_PROXY_BASE:-http://localhost:3000/api/pdf}
    ports:
      - "5001:5001"
    depends_on:
      qdrant:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      rammy-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node.js Express Server ─────────────────────────────────────────────────
  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: rammy-node
    environment:
      - PORT=3000
      - PYTHON_BASE_URL=http://python:5001
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      python:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  seaweedfs_storage:

networks:
  default:
    name: rammy-network